    "blocked_or_excluded_theory_claim_ids": ["T17", "T18"],
    "interpretation": "Weak learning failure alone is not gradient starvation. Exact finite-width response dynamics and the matched BOTH/WEAK intervention separate cross-entropy weighting and response-specific geometry, rate suppression, outcome suppression, weak-only gate failure, and causal starvation. T19 and the initialization-jet results provide only local or assumption-scoped signs; they do not supply a global positive-lag parameter-level predictor. That predictor remains unresolved, as do general positive-disorder closure and nonlinear kernel-stability claims."
  },
