      "statement": "Exact finite-width dense-linear-RNN projected geometry.",
      "evidence": ["src/gradient_starvation/theory.py", "tests/test_theory.py"]
    },
    {
      "id": "T4",
      "status": "proved_with_assumptions",
      "statement": "Exact matched weak-drift decomposition under exact two-mode realization.",
      "evidence": ["src/gradient_starvation/theory.py", "tests/test_theory.py"]
    },
    {
      "id": "T5",
      "status": "proved",
      "statement": "Both equal-time product-difference orderings reconstruct projected drift; neither attribution is canonical.",
      "evidence": ["src/gradient_starvation/theory.py", "tests/test_theory.py"]
    },
    {
      "id": "T6",
      "status": "proved",
      "statement": "After a unique transfer-to-rate-suppression crossing, an outcome crossing occurs exactly when accumulated negative drift reaches the positive peak area.",
      "evidence": ["research_scope/e2_theorem.md#theorem-b1", "src/gradient_starvation/theory.py"]
    },
    {
      "id": "T7",
      "status": "proved_with_assumptions",
      "statement": "A noiseless rank-one cue log-drift ratio yields a monotone sufficient condition for a unique rate crossover, not an outcome crossing by itself.",
      "evidence": ["research_scope/e2_theorem.md#theorem-c"]
    },
    {
      "id": "T8",
      "status": "proved_with_assumptions",
      "statement": "Quantitatively isolated transverse first hitting times are stable under uniform trajectory error with explicit first-entry and mesh hypotheses.",
      "evidence": ["research_scope/e2_theorem.md#corollary-d"]
    },
    {
      "id": "T9",
      "status": "proved",
      "statement": "The zero-bulk-gain, zero-lag, zero-background-noise dense linear full-batch flow closes exactly on six scalars at every width.",
      "evidence": ["research_scope/e2_theorem.md#theorem-e1"]
    },
    {
      "id": "T10",
      "status": "proved_with_assumptions",
      "statement": "The zero-disorder six-scalar process has the stated finite-width initialization and trajectory convergence bounds under the theorem's radius and moment assumptions.",
      "evidence": ["research_scope/e2_theorem.md#theorem-e2"]
    },
    {
      "id": "T11",
      "status": "proved",
      "statement": "CDC exactly preserves instantaneous strong-response drift.",
      "evidence": ["research_scope/cdc_theorem.md#result-1"]
    },
    {
      "id": "T12",
      "status": "proved_with_assumptions",
      "statement": "The uncapped CDC correction is the unique minimum-Euclidean-norm lower-bound-attaining feasible correction in the fixed implemented chart.",
      "evidence": ["research_scope/cdc_theorem.md#result-2"]
    },
    {
      "id": "T13",
      "status": "proved_with_assumptions",
      "statement": "CDC has a fixed-chart O(eta^2) one-step strong-response deviation under local smoothness, segment containment, and stated boundedness assumptions.",
      "evidence": ["research_scope/cdc_theorem.md#result-3"]
    },
    {
      "id": "T14",
      "status": "proved",
      "statement": "The exact finite-width signed-logit/response empirical-NTK flow is dot(r)=K(theta)sigma(-r)/n and dot(M)=C(theta)^T sigma(-r)/n.",
      "evidence": ["research_scope/e2_theorem.md#theorem-a1", "tests/test_theory.py"]
    },
    {
      "id": "T15",
      "status": "proved",
      "statement": "Freezing K0 and C0 defines an exact nonlinear logistic tangent-surrogate ODE, and the implemented recursion is its exact explicit-Euler discretization under tau=eta*k.",
      "evidence": ["src/gradient_starvation/theory.py", "tests/test_theory.py"]
    },
    {
      "id": "T16",
      "status": "proved_with_assumptions",
      "statement": "Continuous and explicit-SGD true-versus-frozen errors are conditionally bounded by caller-supplied uniform instantaneous or secant kernel-movement bounds; zero movement gives exact agreement.",
      "evidence": ["research_scope/oral_theorem_package.md#conditional-secant-kernel-comparison", "tests/test_theory.py"]
    },
    {
      "id": "T17",
      "status": "blocked_conjecture",
