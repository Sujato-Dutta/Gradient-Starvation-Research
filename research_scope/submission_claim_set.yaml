      "id": "T18",
      "status": "open_blocked",
      "statement": "Certified or quantitatively accurate tanh/GRU crossover-time prediction and an analytic learnability/starvation boundary rho_c remain open.",
      "evidence": ["research_scope/claim_ledger.md"]
    },
    {
      "id": "T19",
      "status": "proved_with_assumptions",
      "statement": "For the noiseless positive rank-one dense-linear pair, the exact realized initialization determines d0=s_B(rho*K+A)-s_W*A and its transfer threshold; independently proved uniform product-ball constants then imply unique rate crossing, outcome suppression, optional weak-only learnability, or finite-horizon safe transfer.",
      "evidence": ["research_scope/parameter_prediction_theorem.md", "src/gradient_starvation/theory.py", "tests/test_theory.py"]
    },
    {
      "id": "T20",
      "status": "proved_with_assumptions",
      "statement": "At zero bulk gain, zero lag, and zero background noise, the deterministic symmetric reference has d(0)=0 and d'(0)=-rho^2/2, so suppression starts immediately, while the weak-only response reaches every finite positive target; the corresponding finite-width conclusion requires T10 witness margins.",
      "evidence": ["research_scope/parameter_prediction_theorem.md", "research_scope/e2_theorem.md", "tests/test_theory.py"]
    }
