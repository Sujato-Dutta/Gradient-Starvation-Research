name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            requirements-file: requirements.txt
          - python-version: "3.12.4"
            requirements-file: requirements-lock-py312.txt
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements-file }}
      - run: python scripts/check_submission_readiness.py
      - run: python scripts/check_environment_lock.py
      - run: python verify_release_artifacts.py --require-git-tracked
      - run: test -z "$(git status --porcelain)"
      - run: python -m pip install pip==24.0
      - run: python -m pip install -r "${{ matrix.requirements-file }}"
      - run: python -m pytest -q
