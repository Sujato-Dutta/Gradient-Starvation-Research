experiment:
  name: e3_cdc_validation
  output_root: results
  device: cpu
task:
  sequence_length: 20
  n_samples: 512
  rho_values: [4]
  lag_separations: [2]
  regimes: [positive]
  cue_noise: 0.1
  background_noise: 0.0
  beta: 0.25
  phase_delay: 0.25
model:
  kinds: [low_rank_linear]
  width: 96
  bulk_gain: 0.5
  rank: 2
training:
  steps: 250
  learning_rate: 0.01
  full_batch: true
  log_every: 10
  seeds: [0, 1, 2, 3, 4, 5, 6, 7]
  weight_decay: 0.0
mitigation:
  methods: [erm, spectral_decoupling, interaction, counterfactual_drift]
  coefficient: 0.01
  spectral_coefficient: 0.01
  mode: proxy
  feasibility_epsilon: 1.0e-12
