experiment:
  name: e2_field_validation
  output_root: results
  device: auto
task:
  sequence_length: 20
  n_samples: 4096
  points:
    - {rho: 1, lag_separation: 0}
    - {rho: 2, lag_separation: 4}
    - {rho: 4, lag_separation: 4}
    - {rho: 8, lag_separation: 8}
  regimes: [positive]
  cue_noise: 0.1
  background_noise: 0.0
  beta: 0.5
model:
  kind: low_rank_linear
  widths: [128, 512, 2048]
  bulk_gain: 0.8
  rank: 2
training:
  steps: 1000
  learning_rate: 0.01
  full_batch: true
  log_every: 10
  seeds: [0, 1, 2, 3, 4]
  identity_steps: 5
  weight_decay: 0.0
closure:
  width: 256
  particles: 16
  seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115]

