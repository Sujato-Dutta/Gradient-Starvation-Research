# Initialization-only full empirical-NTK reconstruction on the archived design seeds.
# This is retrospective hypothesis development, not confirmatory evidence.
experiment:
  name: enl_ntk_design_preflight
  output_root: results
  device: cpu
task:
  sequence_length: 20
  n_samples: 256
  rho_values: [4]
  lag_separations: [2]
  regimes: [positive]
  cue_noise: 0.1
  background_noise: 0.0
  beta: 0.5
  phase_delay: 0.25
model:
  kinds: [tanh, gru]
  width: 32
training:
  steps: 1000
  learning_rate: 0.01
  full_batch: true
  log_every: 10
  seeds: [20, 21, 22, 23, 24, 25, 26, 27]
  weight_decay: 0.0
  paired_mode: lockstep
