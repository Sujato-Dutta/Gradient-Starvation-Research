experiment:
  name: waterbirds_transfer
  output_root: results
  device: auto
data:
  root: data
  download: false
  batch_size: 64
  num_workers: 4
model:
  architecture: resnet18
  pretrained: true
training:
  epochs: 30
  learning_rate: 0.0001
  # SGD with zero weight decay is REQUIRED whenever a counterfactual_drift_* arm is
  # present, and it binds every arm in the comparison. The guarantee is stated for the
  # raw corrected velocity: AdamW's preconditioning, momentum and decoupled decay mean
  # the update taken is not the corrected gradient. Running only the CDC arms on SGD
  # would swap a broken guarantee for an optimizer confound, so run_waterbirds rejects
  # that. Drop the CDC arms to use AdamW.
  optimizer: sgd
  weight_decay: 0.0
  # The classifier head is re-drawn per seed so that seed variation is not limited to
  # data order. Within a seed every method still starts from the same draw, which is
  # what the comparison is paired on.
  reinitialize_head_per_seed: true
  seeds: [0, 1, 2]
mitigation:
  # Two information settings, and they must be tabulated separately. Every emitted
  # row carries an `information_setting` column recording which applies.
  #
  #   group_agnostic            erm, spectral_decoupling, counterfactual_drift_modal
  #   oracle_uses_group_labels  interaction, counterfactual_drift_oracle
  #
  # counterfactual_drift_oracle is a mechanistic transfer probe using the background
  # annotation; it is NOT comparable to group-agnostic robustness methods.
  #
  # NOTHING HERE HAS BEEN RUN. See research_scope/waterbirds_setup.md for the dataset
  # and pretrained-asset setup the author must perform first.
  methods:
    - erm
    - spectral_decoupling
    - interaction
    - counterfactual_drift_oracle
    - counterfactual_drift_modal
  coefficient: 0.01
  spectral_coefficient: 0.01
  mode: proxy
  # Waterbirds has no exact strong-ablated counterfactual, so the weak-drift target
  # is a stated surrogate rather than a matched shadow model. See the setup note.
  weak_drift_target: 0.0

