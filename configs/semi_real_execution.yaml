  "selection": {
    "algorithm": "sha256-keyed-per-class-order-v1",
    "key_fields": ["study_id", "dataset", "official_split", "data_seed", "source_class", "source_index"],
    "ordering": "ascending_sha256_then_source_index",
    "training_rule": "first_256_per_class_from_seeded_train_order",
    "test_rule": "first_128_per_class_probe_then_next_128_per_class_evaluation_from_one_seeded_test_order",
    "stable_id_format": "{dataset}:{official_split}:{source_index_8_digit_zero_padded}",
    "split_qualified_ids": true,
    "role_order": ["train", "probe", "evaluation"],
    "within_role_tensor_order": "binary_label_0_seeded_order_then_binary_label_1_seeded_order",
    "selected_tensor_binding": "sha256_and_size_of_ordered_raw_uint8_pixels_and_big_endian_int64_source_labels",
    "within_selection_cross_role_disjoint": true,
    "cross_data_seed_overlap": "allowed_and_disclosed_by_full_role_pair_matrix",
    "manifest_schema": "semi-real-selection-manifest-v1",
    "manifest_serialization": "utf8-canonical-json-sort-keys-compact-newline"
  },
  "preprocessing": {
    "raw_dtype": "uint8",
    "source_decoder": "direct_big_endian_idx_decode_from_hashed_extracted_raw_files",
    "torchvision_processed_cache_policy": "never_read",
    "value_map": "x/127.5-1",
    "resize": {"height": 14, "width": 14, "mode": "area"},
    "augmentation": "none"
  },
  "intervention": {
    "both": "channel_0_real_core_plus_channel_1_label_aligned_generated_patch",
    "weak_only": "bitwise_identical_channel_0_and_channel_1_exactly_zero",
    "cue_strength": 4.0,
    "cue_patch": {"top": 0, "left": 0, "height": 2, "width": 2},
    "required_checks": [
      "labels_equal",
      "sample_ids_equal",
      "core_channel_bitwise_equal",
      "weak_generated_channel_all_zero",
      "only_generated_channel_differs"
    ]
  },
  "response_functionals": {
    "core": "mean_signed_logit_on_fixed_cue_free_test_probe",
    "cue": "one_half_mean_signed_aligned_minus_conflicted_logit_on_same_test_probe",
    "common_across_arms": true,
    "reported_values": "gain_from_each_models_bitwise_shared_initial_value",
    "initial_both_minus_weak_gap": 0.0,
    "drift": "exact_full_batch_direct_autograd_negative_inner_product_response_gradient_loss_gradient",
    "drift_diagnostics_do_not_populate_parameter_grad": true,
    "two_mode_Gg_promotable": false
  },
  "model": {
    "kind": "semi_real_cnn",
    "input_channels": 2,
    "hidden_channels": [16, 32],
    "pretrained": false,
    "initialization": "torch_manual_seed_model_seed_then_deepcopy_shared_model",
    "arm_state_after_initialization": "independent"
  },
  "optimization": {
    "objective": "mean_binary_cross_entropy_with_logits",
    "optimizer": "sgd",
    "full_batch": true,
    "learning_rate": 0.01,
    "steps": 500,
    "log_every": 5,
    "logged_step_start": 0,
    "logged_step_end": 500,
    "logged_point_count": 101,
    "momentum": 0.0,
    "weight_decay": 0.0,
    "gradient_clip": null,
    "arm_pairing": "both_and_weak_from_identical_real_core_images",
    "update_order": ["both", "weak_only"],
    "optimizer_state": "independent_per_arm"
  },
  "seed_design": {
    "data_seeds": [4101, 4102, 4103, 4104],
    "model_seeds": [5101, 5102, 5103, 5104, 5105, 5106, 5107, 5108],
    "crossed": true,
    "records_per_dataset": 32,
    "total_records": 64,
    "record_id_format": "sr-{dataset}-d{data_seed}-m{model_seed}",
    "scientific_seeds_forbidden_in_engineering_smoke": true
  },
  "primary_endpoints": {
    "weak_auc_gap": {
      "integrand": "weak_only_core_gain_minus_both_core_gain",
      "integration": "trapezoid_over_tau",
      "positive_sign": "weak_only_gain_exceeds_both_gain"
    },
    "weak_only_learnability": {
      "target_core_gain": 0.5,
      "first_hit": "first_upward_threshold_hit_linear_interpolation",
      "nondegenerate": "finite_and_strictly_after_tau_zero",
      "horizon_tau": 5.0
    },
    "outcome_suppression": {
      "response_gap": "both_core_gain_minus_weak_only_core_gain",
      "criterion": "strict_outcome_suppression_from_realized_logged_response_tail_certificate",
      "tail_certificate": "one_strict_positive_increment_block_then_one_strict_negative_increment_block_and_post_peak_gap_below_initial",
      "tolerance": 1e-10
    },
    "causal_certificate": "outcome_suppression_and_nondegenerate_weak_only_learnability"
  },
  "trajectory_diagnostics": {
    "drift_gap": "both_exact_core_drift_minus_weak_only_exact_core_drift",
    "response_gap": "both_core_gain_minus_weak_only_core_gain",
    "crossing_direction": "positive_to_negative",
    "crossing_interpolation": "linear_between_logged_points",
    "report_first_drift_crossing": true,
    "report_first_response_crossing": true,
    "report_all_sign_change_counts": true,
    "report_positive_and_negative_drift_areas": true,
    "drift_area_integration": "exact_piecewise_linear_sign_split_trapezoid_over_tau",
    "delay_tolerance": 0.05
  },
  "evaluation": {
    "source": "fixed_evaluation_role_from_official_test_split_disjoint_from_probe",
    "trained_arms": ["both", "weak_only"],
    "input_conditions": ["cue_free", "aligned", "conflicted"],
    "accuracy": "mean_true_binary_label_accuracy_at_logit_zero",
    "gsi5": {
      "policy": "omitted_fail_closed",
      "artifact_marker": "missing_secondary_not_defined_for_evaluation_matrix",
      "required_for_acceptance": false
    }
  },
  "inference": {
    "unit": "paired_record_data_seed_by_model_seed",
    "complete_factorial_required_per_dataset": {"data_seeds": 4, "model_seeds": 8, "records": 32},
    "method": "two_way_pigeonhole_bootstrap",
