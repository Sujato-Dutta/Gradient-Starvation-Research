    "axis_resampling": "independently_sample_4_data_and_8_model_indices_with_replacement_then_average_cross_product",
    "ci": {"lower_quantile": 0.025, "upper_quantile": 0.975, "quantile_method": "linear"},
    "metrics": ["mean_weak_auc_gap", "weak_only_learnability_rate", "causal_certificate_rate"],
    "reporting": "dataset_specific"
