# Fresh validation of the restricted crossing-event hypothesis selected only after
# the broad phase/causal predictor failed its preregistered pilot. No pilot or
# design seed is reused. Acceptance is sealed before nonlinear outcomes exist.
experiment:
  name: enl_ntk_crossing_factorial_preflight
  output_root: results
  device: cpu
held_out_protocol:
  status: prospective_crossing_factorial_validation
  revision_origin: broad_phase_and_causal_predictor_rejected_by_seed_200_pilot
  predictor_role: uncalibrated_drift_and_response_crossing_event_classifier
  primary_outputs:
    - drift_crossing
    - response_crossing
  rejected_as_primary:
    - phase
    - causal_certificate
    - weak_only_learnability
  secondary_uncalibrated_outputs:
    - phase
    - causal_certificate
    - weak_only_learnability
    - drift_crossing_time
    - response_crossing_time
    - response_trajectory_magnitude
    - drift_trajectory_magnitude
  architecture_specific_correction: none
  prediction_abstention: none
  inference_scope: crossed_four_unseen_data_seeds_by_eight_unseen_model_seeds
  reuse_aware_inference:
    method: two_way_pigeonhole_bootstrap
    bootstrap_replicates: 10000
    bootstrap_seed: 2027
  excluded_from_evidence:
    - reason: retrospective_design
      data_seeds: [20, 21, 22, 23, 24, 25, 26, 27]
      model_seeds: [20, 21, 22, 23, 24, 25, 26, 27]
    - reason: broad_predictor_falsification_pilot
      data_seed: 200
      model_seeds: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007]
    - reason: evaluator_float_grid_engineering_failure_generated_unscored_outcomes
      data_seed: 100
      model_seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007]
  acceptance:
    minimum_overall_accuracy: 0.75
    minimum_model_accuracy: 0.625
    minimum_two_way_bootstrap_ci95_low: 0.5
    required_prediction_coverage: 1.0
task:
  sequence_length: 20
  n_samples: 256
  rho_values: [4]
  lag_separations: [2]
  regimes: [positive]
  cue_noise: 0.1
  background_noise: 0.0
  beta: 0.5
  phase_delay: 0.25
model:
  kinds: [tanh, gru]
  width: 32
  bulk_gain: 0.8
training:
  steps: 1000
  learning_rate: 0.01
  full_batch: true
  log_every: 10
  seed_pairs:
    - {data_seed: 201, model_seed: 2010}
    - {data_seed: 201, model_seed: 2011}
    - {data_seed: 201, model_seed: 2012}
    - {data_seed: 201, model_seed: 2013}
    - {data_seed: 201, model_seed: 2014}
    - {data_seed: 201, model_seed: 2015}
    - {data_seed: 201, model_seed: 2016}
    - {data_seed: 201, model_seed: 2017}
    - {data_seed: 202, model_seed: 2010}
    - {data_seed: 202, model_seed: 2011}
    - {data_seed: 202, model_seed: 2012}
    - {data_seed: 202, model_seed: 2013}
    - {data_seed: 202, model_seed: 2014}
    - {data_seed: 202, model_seed: 2015}
    - {data_seed: 202, model_seed: 2016}
    - {data_seed: 202, model_seed: 2017}
    - {data_seed: 203, model_seed: 2010}
    - {data_seed: 203, model_seed: 2011}
    - {data_seed: 203, model_seed: 2012}
    - {data_seed: 203, model_seed: 2013}
    - {data_seed: 203, model_seed: 2014}
    - {data_seed: 203, model_seed: 2015}
    - {data_seed: 203, model_seed: 2016}
    - {data_seed: 203, model_seed: 2017}
    - {data_seed: 204, model_seed: 2010}
    - {data_seed: 204, model_seed: 2011}
    - {data_seed: 204, model_seed: 2012}
    - {data_seed: 204, model_seed: 2013}
    - {data_seed: 204, model_seed: 2014}
    - {data_seed: 204, model_seed: 2015}
    - {data_seed: 204, model_seed: 2016}
    - {data_seed: 204, model_seed: 2017}
  weight_decay: 0.0
  gradient_clip: null
  objective: cross_entropy
  paired_mode: lockstep
  exact_response_drift: true
