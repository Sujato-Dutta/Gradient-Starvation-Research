# E-NL: theorem-aligned transfer/suppression/outcome certificate.
#
# Tanh/GRU responses are common odd symmetric unit-probe contrasts, so paired
# models with shared parameters have exactly the same weak response at tau=0.
# Their logits are not assumed additive in those two responses. The publication
# drift is therefore the universal direct-autograd cross-kernel derivative; the
# projected Gg and matched-state decompositions are retained only as separately
# named diagnostics with an explicit residual.
#
# Regime chosen to match the long-horizon tanh scan that first revealed a projected
# crossover (rho=4, lag 2, ~1000 steps). This rerun determines whether the phenomenon
# survives the corrected common response and exact drift definitions.
#
# Seeds 20-27 are disjoint from every seed already spent on tanh CDC work:
# frozen validation used 6-13 and the width-robustness check used 14-17.  This
# keeps the crossover measurement independent of the mitigation results.
#
# The GRU arm is an architecture contrast, not a failed experiment. A no-crossing
# result is reported as finite-horizon transfer or suppression, never extrapolated.
# Additive geometry/field terms are projected diagnostics; no dominance claim is
# permitted unless it is ordering-invariant, and neither ordering replaces the
# exact direct-autograd drift.
experiment:
  name: enl_tanh_crossover
  output_root: results
  device: cpu
task:
  sequence_length: 20
  n_samples: 256
  rho_values: [4]
  lag_separations: [2]
  regimes: [positive]
  cue_noise: 0.1
  background_noise: 0.0
  beta: 0.5
  phase_delay: 0.25
model:
  kinds: [tanh, gru]
  width: 32
  bulk_gain: 0.8
training:
  steps: 1000
  learning_rate: 0.01
  full_batch: true
  log_every: 10
  seeds: [20, 21, 22, 23, 24, 25, 26, 27]
  weight_decay: 0.0
  paired_mode: lockstep
  # Required by the finite-width theorem: tanh/GRU responses are common
  # symmetric unit-probe contrasts, not exact additive logit coordinates, so
  # crossover timing uses the universal direct-autograd response drift rather
  # than silently treating the projected Gg component as exact.
  exact_response_drift: true
