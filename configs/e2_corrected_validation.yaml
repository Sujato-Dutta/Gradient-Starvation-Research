experiment:
  name: e2_corrected_validation
  output_root: results
  device: cpu
task:
  sequence_length: 20
  n_samples: 1024
  points:
    - {rho: 1, lag_separation: 0}
    - {rho: 2, lag_separation: 2}
    - {rho: 4, lag_separation: 4}
    - {rho: 8, lag_separation: 8}
  regimes: [positive]
  cue_noise: 0.1
  background_noise: 0.0
  beta: 0.25
model:
  kind: dense_linear
  widths: [32, 64, 128, 256]
  bulk_gain: 0.5
training:
  steps: 400
  learning_rate: 0.01
  full_batch: true
  log_every: 10
  seeds: [0, 1, 2, 3, 4, 5, 6, 7]
  identity_steps: 3
  weight_decay: 0.0
closure:
  width: 384
  particles: 16
  seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115]
  field_samples: 32768
  field_seed: 1000003
