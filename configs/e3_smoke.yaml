experiment:
  name: smoke_e3
  output_root: results
  device: cpu
task:
  sequence_length: 5
  n_samples: 12
  rho_values: [2]
  lag_separations: [2]
  regimes: [positive]
  cue_noise: 0.0
  background_noise: 0.0
  beta: -1000000.0
  phase_delay: 1.0
model:
  kinds: [low_rank_linear, tanh, gru]
  width: 6
  bulk_gain: 0.3
  rank: 2
training:
  steps: 1
  learning_rate: 0.01
  full_batch: true
  log_every: 1
  seeds: [0]
  weight_decay: 0.0
mitigation:
  methods: [erm, spectral_decoupling, interaction, counterfactual_drift]
  coefficient: 0.01
  spectral_coefficient: 0.01
  mode: proxy
  feasibility_epsilon: 1.0e-12
