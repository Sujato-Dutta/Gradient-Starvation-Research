experiment:
  name: e3_tanh_cdc_pilot
  output_root: results
  device: cpu
task:
  sequence_length: 20
  n_samples: 256
  rho_values: [4]
  lag_separations: [2]
  regimes: [positive]
  cue_noise: 0.1
  background_noise: 0.0
  beta: 2.0
  phase_delay: 0.25
model:
  kinds: [tanh]
  width: 32
training:
  steps: 750
  learning_rate: 0.01
  full_batch: true
  log_every: 10
  seeds: [2, 3, 4, 5]
  weight_decay: 0.0
mitigation:
  methods: [erm, spectral_decoupling, interaction, counterfactual_drift]
  coefficient: 0.01
  spectral_coefficient: 0.01
  mode: proxy
  feasibility_epsilon: 1.0e-10
